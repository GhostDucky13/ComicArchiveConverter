# GitHub Actions: runs automatically on GitHub's own Windows machines.
#
# On every push and pull request it builds the whole solution and runs all the tests.
# A green tick or red cross then appears next to each commit, and the badge in the README
# shows the result of the latest build.
#
# Release zips are made with build-release.bat (or build-release.ps1) and attached to a
# GitHub Release by hand, so the files people download are exactly the ones that were tested.

name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build ComicArchiveConverter.sln -c Release

      - name: Run tests
        run: dotnet test tests/ComicArchiveConverter.Tests/ComicArchiveConverter.Tests.csproj -c Release --no-build
